# Cloudflare Worker със статични файлове (Workers Builds: build `npm run build`, deploy
# `npx wrangler deploy`). Секретите (TURNSTILE_SECRET, RESEND_API_KEY, TELEGRAM_*) се задават
# в Dashboard → Worker → Settings → Variables and Secrets, НЕ тук. Build-time променливите
# (TURNSTILE_SITE_KEY, UMAMI_URL, UMAMI_WEBSITE_ID) — в Settings → Build → Variables.
# Локално: .dev.vars (виж README.md §Форма - настройка).
name = "pankovsolutions-site"
main = "worker/index.ts"
compatibility_date = "2026-09-03"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Rate limit на формата (5/час на IP): KV namespace „inquiry-rate-limit“ (Dashboard →
# Storage & Databases → KV). Ключовете rl:<ip> изтичат сами след 1 час.
[[kv_namespaces]]
binding = "INQUIRY_RL"
id = "bc9f984e5d2f47498ca3dbaf57ce2c30"

# Записи на съгласията за бисквитки (до 3 години, виж functions/api/consent.ts). Без id:
# wrangler deploy създава namespace-а сам при първото качване и после го ползва (wrangler ≥ 4.45).
[[kv_namespaces]]
binding = "CONSENT_LOG"

[observability]
enabled = true
