# Cloudflare Worker със статични файлове (Workers Builds: build `npm run build`, deploy
# `npx wrangler deploy`). Секретите (TURNSTILE_SECRET, RESEND_API_KEY, TELEGRAM_*) се задават
# в Dashboard → Worker → Settings → Variables and Secrets, НЕ тук. Build-time променливите
# (TURNSTILE_SITE_KEY, UMAMI_URL, UMAMI_WEBSITE_ID) — в Settings → Build → Variables.
# Локално: .dev.vars (виж README.md §Форма - настройка).
name = "pankovsolutions-site"
main = "worker/index.ts"
compatibility_date = "2026-09-03"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Rate limit на формата (5/час на IP) — включва се, когато има KV namespace: създай го в
# Dashboard → Storage & Databases → KV („inquiry-rate-limit“), сложи id-то тук и махни
# коментарите (README §5). Без binding функцията прескача лимита и го логва.
# [[kv_namespaces]]
# binding = "INQUIRY_RL"
# id = "<id от Dashboard → KV>"

[observability]
enabled = true
